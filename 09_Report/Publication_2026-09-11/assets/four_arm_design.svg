<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">Four arms separate electrical and software changes</title><desc id="desc">A two by two experimental matrix. Baseline uses 100 pF and historical unprotected control. EM ONLY uses 1000 pF and historical unprotected control. SW ONLY uses 100 pF and the historical protected policy. COMBINED uses 1000 pF and the historical protected policy. All arms share task, external exposure, governor and matched clean-companion rules.</desc>
<rect width="1440" height="1040" fill="white"/>
<defs><marker id="navyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123B55"/></marker><marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#168B85"/></marker><marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BE781C"/></marker></defs>
<text x="65" y="65" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#111827" font-weight="700" text-anchor="start" >Four arms separate electrical and software changes</text>
<text x="65" y="109" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#556573" font-weight="400" text-anchor="start" >Only differential capacitance and the existing protection choice change between arms</text>
<text x="610" y="184" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#111827" font-weight="700" text-anchor="middle" >Historical unprotected control</text>
<text x="1110" y="184" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#111827" font-weight="700" text-anchor="middle" >Historical protected policy</text>
<text x="68" y="348" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#111827" font-weight="700" text-anchor="start" >Reference network</text>
<text x="68" y="392" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#123B55" font-weight="700" text-anchor="start" >Cd = 100 pF</text>
<text x="68" y="684" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#111827" font-weight="700" text-anchor="start" >Added capacitance</text>
<text x="68" y="728" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#168B85" font-weight="700" text-anchor="start" >Cd = 1,000 pF</text>
<rect x="385" y="230" width="450" height="280" rx="12" fill="#FFFFFF" stroke="#123B55" stroke-width="3"/>
<text x="413" y="294" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#123B55" font-weight="700" text-anchor="start" >BASELINE</text>
<text x="413" y="351" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >100 pF across receiver A pair</text>
<text x="413" y="390" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >Existing unprotected controller</text>
<rect x="890" y="230" width="450" height="280" rx="12" fill="#FFFFFF" stroke="#168B85" stroke-width="3"/>
<text x="918" y="294" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#168B85" font-weight="700" text-anchor="start" >SW_ONLY</text>
<text x="918" y="351" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >100 pF across receiver A pair</text>
<text x="918" y="390" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >Historical observer and supervisor</text>
<text x="918" y="429" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >Historical protected control policy</text>
<rect x="385" y="565" width="450" height="280" rx="12" fill="#FFFFFF" stroke="#123B55" stroke-width="3"/>
<text x="413" y="629" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#123B55" font-weight="700" text-anchor="start" >EM_ONLY</text>
<text x="413" y="686" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >1,000 pF across receiver A pair</text>
<text x="413" y="725" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >Same unprotected controller</text>
<rect x="890" y="565" width="450" height="280" rx="12" fill="#FFFFFF" stroke="#168B85" stroke-width="3"/>
<text x="918" y="629" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#168B85" font-weight="700" text-anchor="start" >COMBINED</text>
<text x="918" y="686" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >1,000 pF across receiver A pair</text>
<text x="918" y="725" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >Same observer and supervisor</text>
<text x="918" y="764" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >Same protected control policy</text>
<text x="65" y="913" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#111827" font-weight="700" text-anchor="start" >Shared in every arm</text>
<text x="65" y="956" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#556573" font-weight="400" text-anchor="start" >Same task and actuator  /  same external source and coupling  /  own matched clean companion</text>
<text x="65" y="998" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#556573" font-weight="400" text-anchor="start" >Common motion governor: 10 rad/s and 200 rad/s2. The governor is not a treatment effect.</text>
</svg>