<path d="M 175 342.7777777777778 H 1360" fill="none" stroke="#BE781C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 9"/>
<rect x="187" y="294.7777777777778" width="463" height="39" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="198" y="322.7777777777778" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#BE781C" font-weight="700" text-anchor="start" >Assumed model-domain limit: 7 V</text>
<path d="M 175 762 H 1360" fill="none" stroke="#556573" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480" y="814" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#111827" font-weight="700" text-anchor="middle" >DEV01</text>
<text x="480" y="853" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#556573" font-weight="400" text-anchor="middle" >Ccp / Ccn = 10 / 9 pF</text>
<text x="1050" y="814" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#111827" font-weight="700" text-anchor="middle" >DEV02</text>
<text x="1050" y="853" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#556573" font-weight="400" text-anchor="middle" >Ccp / Ccn = 200 / 5 pF</text>
<text x="480" y="910" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#168B85" font-weight="700" text-anchor="middle" >Within the assumed receiver domain</text>
<text x="480" y="949" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#556573" font-weight="400" text-anchor="middle" >No persistent EMI count error</text>
<text x="1050" y="910" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#BE781C" font-weight="700" text-anchor="middle" >All four exposed arms rejected</text>
<text x="1050" y="949" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#556573" font-weight="400" text-anchor="middle" >Later fallback behavior is diagnostic only</text>
<text x="70" y="1008" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#556573" font-weight="400" text-anchor="start" >The software counterparts have identical peaks. The 7 V limit is a model assumption, not a measured damage threshold.</text>
</svg>