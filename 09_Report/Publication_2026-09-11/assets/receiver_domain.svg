<rect x="881" y="309.3906426441529" width="140" height="452.6093573558471" rx="0" fill="#123B55" stroke="#123B55" stroke-width="0"/>
<text x="951" y="291.3906426441529" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#111827" font-weight="700" text-anchor="middle" >7.557 V</text>
<rect x="1079" y="280.63877794053536" width="140" height="481.36122205946464" rx="0" fill="#168B85" stroke="#168B85" stroke-width="0"/>
