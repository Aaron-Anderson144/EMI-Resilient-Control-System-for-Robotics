<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1030" viewBox="0 0 1450 1030" role="img" aria-labelledby="title desc">
<title id="title">Development exposes a receiver model boundary</title><desc id="desc">Grouped bar chart of peak absolute receiver common-mode voltage. DEV01 at coupling Ccp/Ccn 10/9 pF reaches 3.34750050200855 V at 100 pF and 3.34750776203227 V at 1000 pF differential capacitance. DEV02 at coupling 200/5 pF reaches 7.5574846311737 V and 8.03757142585377 V respectively. The assumed model domain is at most 7 V. DEV01 passes and has no persistent EMI count error. All exposed DEV02 arms are rejected, so later fallback diagnostics cannot support a mitigation claim.</desc>
<rect width="1450" height="1030" fill="white"/>
<defs><marker id="navyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123B55"/></marker><marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#168B85"/></marker><marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BE781C"/></marker></defs>
<text x="70" y="65" font-family="Arial, Helvetica, sans-serif" font-size="41" fill="#111827" font-weight="700" text-anchor="start" >Development exposes a receiver model boundary</text>
<text x="70" y="108" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#556573" font-weight="400" text-anchor="start" >Peak absolute common-mode voltage at the receiver in the development campaign</text>
