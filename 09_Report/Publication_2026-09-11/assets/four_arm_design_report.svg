<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="750" viewBox="0 0 1440 750" role="img" aria-labelledby="title desc">
<title id="title">Four arms separate electrical and software changes</title><desc id="desc">Compact report version of the two by two frozen experimental design. Baseline uses 100 pF with unprotected control. SW ONLY uses 100 pF with historical protected policy. EM ONLY uses 1000 pF with unprotected control. COMBINED uses 1000 pF with the protected policy. The task, source, coupling and governor are shared; each arm has its own clean companion.</desc>
<rect width="1440" height="750" fill="white"/>
<defs><marker id="navyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123B55"/></marker><marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#168B85"/></marker><marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BE781C"/></marker></defs>
<text x="65" y="58" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#111827" font-weight="700" text-anchor="start" >Four arms separate electrical and software changes</text>
<text x="65" y="99" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#556573" font-weight="400" text-anchor="start" >The frozen design crosses differential capacitance with the existing protection choice</text>
<text x="610" y="159" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#111827" font-weight="700" text-anchor="middle" >Historical unprotected control</text>
<text x="1110" y="159" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#111827" font-weight="700" text-anchor="middle" >Historical protected policy</text>
<text x="68" y="257" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#111827" font-weight="700" text-anchor="start" >Reference network</text>
<text x="68" y="298" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#123B55" font-weight="700" text-anchor="start" >Cd = 100 pF</text>
<text x="68" y="462" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#111827" font-weight="700" text-anchor="start" >Added capacitance</text>
<text x="68" y="503" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#168B85" font-weight="700" text-anchor="start" >Cd = 1,000 pF</text>
<rect x="385" y="193" width="450" height="171" rx="12" fill="#FFFFFF" stroke="#123B55" stroke-width="3"/>
<text x="410" y="244" font-family="Arial, Helvetica, sans-serif" font-size="33" fill="#123B55" font-weight="700" text-anchor="start" >BASELINE</text>
<text x="410" y="291" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#556573" font-weight="400" text-anchor="start" >Existing unprotected controller</text>
<rect x="890" y="193" width="450" height="171" rx="12" fill="#FFFFFF" stroke="#168B85" stroke-width="3"/>
<text x="915" y="244" font-family="Arial, Helvetica, sans-serif" font-size="33" fill="#168B85" font-weight="700" text-anchor="start" >SW_ONLY</text>
<text x="915" y="291" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#556573" font-weight="400" text-anchor="start" >Historical observer and supervisor</text>
<text x="915" y="327" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#556573" font-weight="400" text-anchor="start" >Historical protected control policy</text>
<rect x="385" y="398" width="450" height="171" rx="12" fill="#FFFFFF" stroke="#123B55" stroke-width="3"/>
<text x="410" y="449" font-family="Arial, Helvetica, sans-serif" font-size="33" fill="#123B55" font-weight="700" text-anchor="start" >EM_ONLY</text>
<text x="410" y="496" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#556573" font-weight="400" text-anchor="start" >Same unprotected controller</text>
<rect x="890" y="398" width="450" height="171" rx="12" fill="#FFFFFF" stroke="#168B85" stroke-width="3"/>
<text x="915" y="449" font-family="Arial, Helvetica, sans-serif" font-size="33" fill="#168B85" font-weight="700" text-anchor="start" >COMBINED</text>
<text x="915" y="496" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#556573" font-weight="400" text-anchor="start" >Same observer and supervisor</text>
<text x="915" y="532" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#556573" font-weight="400" text-anchor="start" >Same protected control policy</text>
<text x="65" y="634" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#111827" font-weight="700" text-anchor="start" >Shared in every arm</text>
<text x="65" y="676" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#556573" font-weight="400" text-anchor="start" >Same task, actuator, external source and coupling. Each arm has its own matched clean companion.</text>
<text x="65" y="718" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#556573" font-weight="400" text-anchor="start" >Common motion governor: 10 rad/s and 200 rad/s2. The governor is not a treatment effect.</text>
</svg>