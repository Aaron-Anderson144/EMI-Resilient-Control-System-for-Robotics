<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="760" viewBox="0 0 1450 760" role="img" aria-labelledby="title desc">
<title id="title">Development exposes a receiver model boundary</title><desc id="desc">Compact report version of peak absolute common-mode voltage. DEV01 peaks are 3.34750050200855 V at 100 pF and 3.34750776203227 V at 1000 pF. DEV02 peaks are 7.5574846311737 V and 8.03757142585377 V. All four exposed DEV02 arms exceed the assumed 7 V receiver model domain and are rejected. Software counterparts have identical peaks. The limit is a behavioral model assumption, not a measured damage threshold.</desc>
