<text x="1050" y="617" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#556573" font-weight="400" text-anchor="middle" >Ccp / Ccn = 200 / 5 pF</text>
<text x="480" y="662" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#168B85" font-weight="700" text-anchor="middle" >Within domain; no persistent EMI count error</text>
<text x="1050" y="662" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#BE781C" font-weight="700" text-anchor="middle" >All four exposed arms rejected</text>
<text x="70" y="709" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#556573" font-weight="400" text-anchor="start" >The software counterparts have identical peaks. DEV02 fallback behavior is diagnostic only.</text>
