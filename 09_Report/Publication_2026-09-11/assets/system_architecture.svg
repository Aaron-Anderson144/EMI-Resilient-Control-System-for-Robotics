<text x="95" y="334" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >Holds motor voltage</text>
<text x="95" y="368" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >for the next 1 ms interval</text>
