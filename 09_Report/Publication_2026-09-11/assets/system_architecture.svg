<text x="560" y="334" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >to the current held voltage</text>
<text x="560" y="368" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#556573" font-weight="400" text-anchor="start" >Representative actuator</text>
