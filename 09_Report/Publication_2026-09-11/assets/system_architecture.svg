<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1110" viewBox="0 0 1540 1110" role="img" aria-labelledby="title desc">
<title id="title">How electrical interference reaches the controller</title><desc id="desc">Clockwise causal loop from controller through exact continuous motor trajectory, intended quadrature encoder transitions, loaded A circuit with ideal B bypass, Schmitt receiver and persistent decoder, then a strict three-field measurement packet. A separate saved switching replay injects one-way capacitive interference. A no-aggressor shadow and scoring run offline and never feed control.</desc>
<rect width="1540" height="1110" fill="white"/>
